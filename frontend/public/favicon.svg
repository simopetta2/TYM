<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Il quadrato rosso inclinato -->
  <rect x="6" y="6" width="52" height="52" rx="2" fill="#e63244" transform="skewX(-8)" transform-origin="32 32" />
  
  <!-- Il testo TYM centrato e raddrizzato -->
  <text 
    x="50%" 
    y="55%" 
    tight-bounding-box="true"
